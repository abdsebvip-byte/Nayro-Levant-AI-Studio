[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nayro-studio"
version = "0.1.0"
description = "Nayro Levant AI Studio - text-to-video generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "imageio-ffmpeg>=0.5",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
]

[project.optional-dependencies]
voice = ["edge-tts>=7.0", "gTTS>=2.5"]
dev = ["pytest>=7.4"]

[project.scripts]
nayro-video = "nayro_studio.cli:main"

[tool.setuptools.packages.find]
include = ["nayro_studio*"]

[tool.setuptools.package-data]
nayro_studio = ["assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
